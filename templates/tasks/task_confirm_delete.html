{% extends "base.html" %}

{% block title %}Delete Task{% endblock %}

{% block content %}
  <div class="card">
    <div class="card-body">
      <h3>Delete Task</h3>
      <p>Are you sure you want to delete task "{{ task.content }}"?</p>
      <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-danger">Yes, delete</button>
          <a href="{% url 'tasks:task-list' %}" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
