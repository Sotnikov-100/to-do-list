{% extends "base.html" %}
{% block title %}Tag List{% endblock %}

{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Tag List</h2>
    <a href="{% url 'tasks:tag-create' %}" class="btn btn-primary">Add Tag</a>
  </div>

  {% if tags %}
    <table class="table table-striped">
      <thead>
      <tr>
        <th>Name</th>
        <th>Actions</th>
      </tr>
      </thead>
      <tbody>
      {% for tag in tags %}
        <tr>
          <td>{{ tag.name }}</td>
          <td>
            <div class="btn-group">
              <a href="{% url 'tasks:tag-update' tag.pk %}" class="btn btn-sm btn-outline-secondary">Edit</a>
              <a href="{% url 'tasks:tag-delete' tag.pk %}" class="btn btn-sm btn-outline-danger">Delete</a>
            </div>
          </td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  {% else %}
    <div class="alert alert-info">
      No tags found. Add a new tag by clicking the button above.
    </div>
  {% endif %}
{% endblock %}
