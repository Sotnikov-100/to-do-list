{% extends "base.html" %}

{% block title %}Delete Tag{% endblock %}

{% block content %}
  <div class="card">
    <div class="card-body">
      <h3>Delete Tag</h3>
      <p>Are you sure you want to delete the tag "{{ tag.name }}"?</p>
      <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-danger">Yes, delete</button>
          <a href="{% url 'tasks:tag-list' %}" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
